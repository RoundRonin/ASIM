version: '3.9'

services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    container_name: ASIM-backend-api
    ports:
      - "8080:8080"
    volumes:
      - ./back/:/app/
      - ~/.nuget/packages:/root/.nuget/packages
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network
    entrypoint: [ "/app/entrypoint.sh" ]

  db:
    image: postgres
    container_name: ASIM-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:


volumes:
  postgres_data:
